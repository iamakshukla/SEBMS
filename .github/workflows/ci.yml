name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an older, still-running build pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SEBMS.sln

      - name: Build
        run: dotnet build SEBMS.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test SEBMS.sln --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/*.trx
          if-no-files-found: ignore
